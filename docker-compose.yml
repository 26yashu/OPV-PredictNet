# ==============================================================================
# OPV-PredictNet — Docker Compose Specification
# Local Demonstration and Reproducible Deployment Stack
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: opv-predictnet-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=sqlite:////app/data/opv_predictnet.db
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"]
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-demo-secret-key-change-in-production-min32chars}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - RESEARCH_ESTIMATE_ONLY=True
      - VALIDATED_FOR_PRODUCTION=False
    volumes:
      - opv_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: opv-predictnet-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  opv_data:
    name: opv_predictnet_data
    driver: local
